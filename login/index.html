<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Global error logger (load first to catch all errors) -->
    <script type="module" src="/resources/js/error-logger.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login | AK Portfolio</title>
    <link rel="shortcut icon" href="/resources/img/AK.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/resources/css/reset.css" />
    <link rel="stylesheet" href="/resources/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="home">
        <h1>A|K</h1>
        <h2>Andy | Keys</h2>
        <h2>Admin Login</h2>
    </header>
    <nav>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span class="nav-toggle-label">A|K</span>
            <span class="nav-toggle-icon">☰</span>
        </button>
        <ul class="nav">
            <li><a href="/">🏠 Home</a></li>
            <li><button id="dark-mode-toggle" type="button" aria-label="Switch to dark mode">☾</button></li>
        </ul>
    </nav>

    <main class="admin-page">
        <section class="sec-cont login-section">
            <div class="admin-card" id="login-card">
                <h2>Secure access only</h2>

                <p id="verify-status" class="login-message" style="display:none;"></p>

                <button id="passkey-btn" type="button" class="btn-primary">Sign in with passkey</button>

                <div class="login-divider"><span>or</span></div>

                <form id="email-form">
                    <label>Email
                        <input id="email-input" type="email" placeholder="your@email.com" autocomplete="email" />
                    </label>
                    <button type="submit" class="btn-secondary">Send magic link</button>
                </form>

                <p id="login-message" class="login-message"></p>
                <p><a href="/">Back to public site</a></p>
            </div>
        </section>
    </main>

    <script src="/resources/js/dev-env.js"></script>
    <script type="module" src="/resources/js/login.js"></script>
    <script src="/resources/js/darkmode.js"></script>
    <script src="/resources/js/nav.js"></script>
</body>
</html>
