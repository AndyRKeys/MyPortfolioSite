# Consolidated security headers for all nginx environments.
# Included by nginx-local.conf.template, nginx-dev-server.conf.template, and nginx-portfolio.conf.template.
# Single source of truth to prevent duplication and keep CSP sources in sync across environments.

# Content Security Policy — whitelist external resources
# Sources:
#   - unpkg.com: SimpleWebAuthn library (@simplewebauthn/browser)
#   - cdn.jsdelivr.net: GitHub repos widget, Leaflet map library
#   - esm.sh: ES modules CDN (used by dev server for webauthn)
#   - fonts.googleapis.com / fonts.gstatic.com: Google Fonts
#   - *.tile.openstreetmap.org: OpenStreetMap tiles (travel map)
#   - api.github.com: GitHub API (repos widget)
add_header Content-Security-Policy "
  default-src 'self';
  script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://esm.sh;
  style-src  'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com;
  font-src   'self' https://fonts.gstatic.com;
  img-src    'self' data: https://*.tile.openstreetmap.org https://unpkg.com;
  connect-src 'self' https://api.github.com;
  frame-ancestors 'none';
  report-uri /api/debug/csp-violations;
" always;

# Prevent MIME-type sniffing (forces content-type header respect)
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking / frame embedding
add_header X-Frame-Options "DENY" always;

# Referrer policy for privacy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable unused browser APIs
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
