<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Andy Keys</title>
    <link rel="stylesheet" href="./resources/css/styles.css" />
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
        <h2>Andy Keys</h2>
    </header>
    <nav>
        <ul class="nav">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./blog.html">Blog</a></li>
            <li><a href="./travel.html">Travel</a></li>
            <li><a href="./admin.html">Admin</a></li>
            <li><button id="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button></li>
        </ul>
    </nav>

    <main>
        <!-- ── Travel uploader ─────────────────────────────────────────── -->
        <section id="travel-admin" class="admin-page login-section" style="display:none">
            <h2>Upload Travel Memory</h2>
            <div class="admin-card">
                <h3 class="admin-card-title">New memory</h3>
                <form id="travel-form">
                    <label>
                        Title
                        <input id="travel-title" type="text" placeholder="e.g. Sunset at Santorini" />
                    </label>
                    <label>
                        Location
                        <input id="travel-location" type="text" placeholder="e.g. Santorini, Greece" />
                    </label>
                    <label>
                        Date
                        <input id="travel-date" type="date" />
                    </label>
                    <label>
                        Caption
                        <textarea id="travel-caption" rows="3" placeholder="A short description…"></textarea>
                    </label>
                    <label>
                        Coordinates (optional)
                        <div class="coord-row">
                            <label>
                                Latitude
                                <div class="coord-stepper">
                                    <button type="button" class="coord-step-btn" data-target="travel-lat" data-step="-0.0001">−</button>
                                    <input id="travel-lat" type="number" step="0.0001" placeholder="e.g. 36.3932" />
                                    <button type="button" class="coord-step-btn" data-target="travel-lat" data-step="0.0001">+</button>
                                </div>
                            </label>
                            <label>
                                Longitude
                                <div class="coord-stepper">
                                    <button type="button" class="coord-step-btn" data-target="travel-lng" data-step="-0.0001">−</button>
                                    <input id="travel-lng" type="number" step="0.0001" placeholder="e.g. 25.4615" />
                                    <button type="button" class="coord-step-btn" data-target="travel-lng" data-step="0.0001">+</button>
                                </div>
                            </label>
                        </div>
                    </label>
                    <label>
                        Photo / Video
                        <div class="file-input-wrap">
                            <button type="button" class="file-input-btn">Choose file</button>
                            <span class="file-input-label">No file chosen</span>
                            <input id="travel-file" type="file" accept="image/*,video/*" class="file-input-hidden" />
                        </div>
                    </label>
                    <div id="travel-preview" class="travel-preview hidden">
                        <div class="preview-media"></div>
                        <div class="preview-text"></div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="travel-submit" class="btn-primary">Upload</button>
                        <button type="button" id="travel-reset" class="btn-secondary">Clear</button>
                    </div>
                </form>
                <p id="travel-message" class="admin-message"></p>

                <h4 class="saved-list-title">Saved memories</h4>
                <div id="saved-memories-list"></div>
            </div>
        </section>

        <!-- ── Blog post editor ────────────────────────────────────────── -->
        <section id="blog-admin" class="admin-page login-section" style="display:none">
            <h2>Blog Posts</h2>
            <div class="admin-card">
                <h3 class="admin-card-title" id="post-form-heading">New post</h3>
                <form id="post-form">
                    <input type="hidden" id="post-edit-id" value="" />
                    <label>
                        Title
                        <input id="post-title" type="text" placeholder="Post title…" />
                    </label>
                    <label>
                        Date
                        <input id="post-date" type="date" />
                    </label>
                    <label>
                        Body <span style="font-weight:400;color:var(--color-text-muted);font-size:0.85rem">(Markdown supported)</span>
                        <textarea id="post-body" rows="10" placeholder="Write your post in Markdown…"></textarea>
                    </label>
                    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer">
                        <input id="post-published" type="checkbox" style="width:auto;margin:0" />
                        Publish immediately
                    </label>
                    <div class="form-actions">
                        <button type="submit" id="post-submit" class="btn-primary">Save post</button>
                        <button type="button" id="post-cancel" class="btn-secondary" style="display:none">Cancel</button>
                    </div>
                </form>
                <p id="post-message" class="admin-message"></p>

                <h4 class="saved-list-title">Saved posts</h4>
                <div id="saved-posts-list"></div>
            </div>
        </section>

        <!-- ── Login gate (shown until authenticated) ──────────────────── -->
        <section id="login-section" class="login-section">
            <h2>Admin Login</h2>
            <div class="admin-card">
                <h3 class="admin-card-title">Sign in</h3>
                <form id="login-form">
                    <label>
                        Password
                        <input id="login-password" type="password" placeholder="Enter admin password" autocomplete="current-password" />
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Login</button>
                    </div>
                </form>
                <p id="login-message" class="login-message"></p>
            </div>
        </section>
    </main>

    <footer>
        <div id="contact">
            <div class="contact-wrapper">
                <div class="contact-info">
                    <h3>Get In Touch</h3>
                    <p>📧 <a href="mailto:andy@andykeys.dev">andy@andykeys.dev</a></p>
                    <p>💼 <a href="https://linkedin.com/in/andy-keys" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
                    <p>🐙 <a href="https://github.com/AndyRKeys" target="_blank" rel="noopener noreferrer">GitHub</a></p>
                </div>
                <div class="footer-links">
                    <h3>Quick Links</h3>
                    <p><a href="./index.html">Home</a></p>
                    <p><a href="./blog.html">Blog</a></p>
                    <p><a href="./travel.html">Travel</a></p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2025 Andy Keys. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="./resources/java/jquery-3.5.1.min.js"></script>
    <script type="module" src="./resources/java/admin.js"></script>
    <script>
        // Default travel date and post date to today
        (function () {
            var today = new Date();
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            var todayStr = yyyy + '-' + mm + '-' + dd;
            var travelDate = document.getElementById('travel-date');
            if (travelDate) travelDate.value = todayStr;
            var postDate = document.getElementById('post-date');
            if (postDate) postDate.value = todayStr;
        })();

        // Issue #34: wire styled file input button to hidden native input
        (function () {
            var btn = document.querySelector('.file-input-btn');
            var input = document.getElementById('travel-file');
            var label = document.querySelector('.file-input-label');
            if (!btn || !input || !label) return;
            btn.addEventListener('click', function () { input.click(); });
            input.addEventListener('change', function () {
                label.textContent = input.files.length ? input.files[0].name : 'No file chosen';
            });
        })();

        // Issue #39: coordinate stepper buttons
        (function () {
            document.querySelectorAll('.coord-step-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var targetId = btn.getAttribute('data-target');
                    var step = parseFloat(btn.getAttribute('data-step'));
                    var input = document.getElementById(targetId);
                    if (!input) return;
                    var current = parseFloat(input.value) || 0;
                    input.value = (current + step).toFixed(4);
                });
            });
        })();

        // Dark mode toggle
        (function () {
            var toggle = document.getElementById('dark-mode-toggle');
            var root = document.documentElement;
            var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            root.setAttribute('data-theme', dark ? 'dark' : 'light');
            if (toggle) toggle.textContent = dark ? '☀️' : '🌙';
            if (toggle) toggle.addEventListener('click', function () {
                dark = !dark;
                root.setAttribute('data-theme', dark ? 'dark' : 'light');
                toggle.textContent = dark ? '☀️' : '🌙';
            });
        })();
    </script>
</body>
</html>
