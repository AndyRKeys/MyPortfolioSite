<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Global error logger (load first to catch all errors) -->
    <script type="module" src="/resources/js/error-logger.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog | AK Portfolio</title>
    <link rel="shortcut icon" href="/resources/img/AK.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/resources/css/reset.css" />
    <link rel="stylesheet" href="/resources/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="home">
        <h1>A|K</h1>
        <h2>Andy | Keys</h2>
        <h2>Writing</h2>
    </header>
    <nav>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span class="nav-toggle-label">A|K</span>
            <span class="nav-toggle-icon">☰</span>
        </button>
        <ul class="nav"></ul>
    </nav>

    <main>
        <section class="sec-cont" id="blog">
            <h2>Posts</h2>

            <form id="listing-search-form" class="search-form listing-search-form" role="search">
                <div class="search-input-wrap">
                    <input id="listing-search-input" type="search" name="q" placeholder="Search posts…" class="search-input" aria-label="Search blog posts" autocomplete="off" />
                    <button type="submit" class="btn-primary search-submit">Search</button>
                </div>
            </form>
            <div id="listing-search-results" class="listing-search-results" aria-live="polite" hidden></div>

            <div class="blog-view-toggle" role="tablist">
                <button type="button" class="view-toggle-btn active" data-view="timeline" role="tab" aria-selected="true">Timeline</button>
                <button type="button" class="view-toggle-btn" data-view="cards" role="tab" aria-selected="false">Cards</button>
            </div>

            <div id="posts-list" class="posts-list hidden"></div>
            <div id="blog-timeline" class="timeline"></div>
            <div id="posts-empty" class="posts-empty hidden">
                <p>No posts yet &mdash; check back soon.</p>
            </div>
        </section>
    </main>

    <footer>
        <section class="sec-cont" id="contact">
            <div class="footer-bottom">
                <p>&copy; 2026 Andrew Keys. All Rights Reserved.</p>
            </div>
        </section>
    </footer>

    <script src="/resources/js/dev-env.js"></script>
    <script src="/resources/js/darkmode.js"></script>
    <script src="/resources/js/nav.js"></script>
    <script type="module" src="/resources/js/blog.js"></script>
</body>
</html>
