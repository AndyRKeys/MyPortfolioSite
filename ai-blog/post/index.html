<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Global error logger (load first to catch all errors) -->
    <script type="module" src="/resources/js/error-logger.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Dev Blog | AK Portfolio</title>
    <link rel="shortcut icon" href="/resources/img/AK.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/resources/css/reset.css" />
    <link rel="stylesheet" href="/resources/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="home">
        <h1>A|K</h1>
        <h2>Andy | Keys</h2>
        <h2 id="post-header-title">Loading…</h2>
    </header>
    <nav>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span class="nav-toggle-label">A|K</span>
            <span class="nav-toggle-icon">☰</span>
        </button>
        <ul class="nav"></ul>
    </nav>

    <main>
        <div class="post-back-bar sec-cont">
            <a href="/ai-blog/" class="post-back-link">← All AI Dev Blog entries</a>
        </div>
        <article class="sec-cont post-article" id="post-content">
            <div id="post-loading" class="hint" style="text-align:center;padding:3rem;">Loading entry…</div>
            <div id="post-body" class="hidden">
                <header class="post-article-header">
                    <h2 id="post-title"></h2>
                    <p class="post-meta"><span id="post-date" class="blog-date"></span></p>
                </header>
                <hr class="post-divider" />
                <div id="post-markdown" class="post-markdown"></div>
            </div>
            <div id="post-error" class="hidden" style="text-align:center;padding:3rem;color:var(--color-error);">
                Entry not found. <a href="/ai-blog/">Back to AI Dev Blog</a>.
            </div>
        </article>
    </main>

    <footer>
        <section class="sec-cont" id="contact">
            <div class="footer-bottom">
                <p>&copy; 2026 Andrew Keys. All Rights Reserved.</p>
            </div>
        </section>
    </footer>

    <script src="/resources/js/dev-env.js"></script>
    <script src="/resources/js/darkmode.js"></script>
    <script src="/resources/js/nav.js"></script>
    <!-- Pinned to v9 for stable synchronous marked.parse() API -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <!-- SRI hash must match the exact version in ai-blog-post.js import. Recompute on upgrade:
         curl -sL https://cdn.jsdelivr.net/npm/dompurify@NEW/dist/purify.es.mjs | openssl dgst -sha384 -binary | openssl base64 -A -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/dompurify@3.4.7/dist/purify.es.mjs"
          integrity="sha384-iwQ63xeXeCJmVOwihV+YG1ZTZSe+pL+1X9OgiZQikgf+juy+bYFkn3HvaRqFVVyO"
          crossorigin="anonymous">
    <script type="module" src="/resources/js/ai-blog-post.js"></script>
</body>
</html>
