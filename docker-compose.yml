# Unified server Docker Compose — used for BOTH dev and prod server deploys.
# All environment-specific behaviour comes from .env (ports, cert paths,
# hostnames, volume names, etc.). Container/volume isolation between dev and
# prod on the same host comes from COMPOSE_PROJECT_NAME, set in .env.
#
# Usage (always via scripts/deploy/deploy.sh — never run directly):
#   deploy.sh --env <dev|prod>
#
# For local laptop development, use docker-compose.local.yml instead — that
# file has source bind-mounts and exposes the DB port for psql.
#
# Prerequisites:
#   - .env in repo root, created from .env.dev-server.example (dev) or
#     .env.example (prod) and populated with all required values
#   - For dev: self-signed certs generated at $CERT_MOUNT_SRC
#     (bash scripts/setup/generate-dev-certs.sh $LAN_IP $SITE_HOST)
#   - For prod: Let's Encrypt certs present at $CERT_MOUNT_SRC

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: ${PORT}
      DEPLOY_ENV: ${DEPLOY_ENV}
      REPO_DIR: /repo
      DEPLOY_FROM_CONTAINER: "1"
      DEPLOY_REPO_DIR: /repo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      SITE_HOST: ${SITE_HOST:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
      OUTLOOK_REFRESH_TOKEN: ${OUTLOOK_REFRESH_TOKEN:-}
      OUTLOOK_EMAIL: ${OUTLOOK_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_KEY: ${SERVICE_KEY:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - .:/repo  # repo root — needed by deploy route for git commands and deploy script
      # SECURITY: docker.sock grants the backend full control over the host Docker daemon.
      # Required by the deploy route (backend/routes/deploy.js) to run docker compose
      # commands from the admin panel. Trade-off accepted for a self-hosted hobby project,
      # but represents a significant privilege escalation surface — any RCE in the backend
      # container could escape to the host. Revisit with a dedicated deploy agent: #450.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      # Primary HTTPS port — 3001 (dev) or 443 (prod).
      - "${NGINX_PORT}:${NGINX_PORT}"
      # HTTP port — used by prod for Let's Encrypt ACME challenges and
      # 301 → HTTPS redirect. Dev binds it to a localhost-only dummy port
      # so the mapping exists but doesn't conflict with prod on the same host.
      - "${NGINX_HTTP_HOST_PORT}:80"
    volumes:
      - ${NGINX_CONF_TEMPLATE}:/etc/nginx/templates/default.conf.template
      - ./scripts/config/nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - .:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
      - ${CERT_MOUNT_SRC}:${CERT_MOUNT_DST}:ro
    environment:
      DOMAIN: ${SITE_HOST}
      REPO_DIR: /usr/share/nginx/html
      APP_PORT: ${PORT}
      BACKEND_HOST: backend
      DEPLOY_VERSION: ${DEPLOY_VERSION:-dev}
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# Explicit volume names let .env preserve existing data when upgrading from
# the per-env compose files (uploads_dev_data → uploads_dev_data, etc.). Leave
# the *_VOLUME_NAME vars unset in .env to get fresh project-namespaced volumes.
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_postgres_data}
  uploads_data:
    name: ${UPLOADS_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_uploads_data}
