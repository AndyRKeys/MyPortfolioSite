<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="/resources/js/error-logger.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Dev Blog | Admin | AK Portfolio</title>
    <link rel="shortcut icon" href="/resources/img/AK.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/resources/css/reset.css" />
    <link rel="stylesheet" href="/resources/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>A|K</h1>
        <h2>Andy | Keys</h2>
        <h2>Admin</h2>
    </header>
    <nav>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span class="nav-toggle-label">A|K</span>
            <span class="nav-toggle-icon">☰</span>
        </button>
        <ul class="nav">
            <li><a href="/">Home</a></li>
            <li><a href="/blog/" target="_blank" rel="noopener noreferrer">✏ Blog</a></li>
            <li><a href="/travel/" target="_blank" rel="noopener noreferrer">✈ Travel</a></li>
            <li><a href="/ai-blog/" target="_blank" rel="noopener noreferrer">🤖 AI Dev Blog</a></li>
            <li><a href="/login/" id="logout-link">Logout</a></li>
            <li><button id="dark-mode-toggle" type="button" aria-label="Switch to dark mode">☾</button></li>
        </ul>
    </nav>

    <main class="admin-page">
        <section class="sec-cont admin-panel">
            <div class="admin-card">
                <h2 class="admin-card-title">AI Dev Blog entries</h2>
                <form id="ai-blog-form">
                    <input type="hidden" id="ai-blog-edit-id" value="" />
                    <label>Title
                        <input id="ai-blog-title" type="text" placeholder="Session title, e.g. Day 12 — Adding AI Dev Blog" />
                    </label>
                    <label>Date
                        <input id="ai-blog-date" type="date" />
                    </label>
                    <label>Body (Markdown)
                        <textarea id="ai-blog-body" rows="12" placeholder="Write your session summary in Markdown…"></textarea>
                    </label>
                    <div class="form-actions">
                        <button type="submit" id="ai-blog-save-btn" class="btn-primary">Save draft</button>
                        <button type="submit" id="ai-blog-publish-btn" class="btn-primary">Publish</button>
                        <button type="button" id="ai-blog-template-btn" class="btn-secondary">Insert template</button>
                        <button type="button" id="ai-blog-clear-btn" class="btn-secondary">Clear</button>
                        <button type="button" id="ai-blog-cancel-btn" class="btn-secondary hidden">Cancel edit</button>
                    </div>
                </form>
                <p id="ai-blog-message" class="admin-message"></p>
                <div class="saved-memories">
                    <h3 class="saved-list-title">All entries</h3>
                    <div id="ai-blog-admin-list">
                        <p class="hint">Loading…</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/resources/js/dev-env.js"></script>
    <script src="/resources/js/darkmode.js"></script>
    <script src="/resources/js/nav.js"></script>
    <script src="/resources/js/admin-subnav.js"></script>
    <script src="/resources/js/admin-init.js"></script>
    <script type="module" src="/resources/js/admin-ai-blog-page.js"></script>
</body>
</html>
