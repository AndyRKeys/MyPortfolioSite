<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Memory | AK Portfolio</title>
    <link rel="shortcut icon" href="./resources/img/AK.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./resources/css/reset.css" />
    <link rel="stylesheet" href="./resources/css/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="home">
        <h1>A|K</h1>
        <h2>Andy | Keys</h2>
        <h2 id="post-header-title">Loading…</h2>
    </header>
    <nav>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span class="nav-toggle-label">A|K</span>
            <span class="nav-toggle-icon">☰</span>
        </button>
        <ul class="nav">
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="index.html#about">👤 About</a></li>
            <li><a href="index.html#portfolio">💼 Projects</a></li>
            <li><a href="index.html#ai-dev">🤖 AI Dev</a></li>
            <li><a href="index.html#timeline">📅 Timeline</a></li>
            <li><a href="index.html#skills">🛠 Skills</a></li>
            <li><a href="index.html#github-activity">🐙 GitHub</a></li>
            <li><a href="index.html#contact">✉ Contact</a></li>
            <li><a href="blog.html">✏ Blog</a></li>
            <li><a href="travel.html">✈ Travel</a></li>
            <li><a href="login.html">🔒 Admin</a></li>
            <li><button id="dark-mode-toggle" type="button" aria-label="Switch to dark mode">☾</button></li>
        </ul>
    </nav>

    <main>
        <div class="post-back-bar sec-cont">
            <a href="travel.html" class="post-back-link">← All travel memories</a>
        </div>
        <article class="sec-cont post-article" id="post-content">
            <div id="post-loading" class="hint" style="text-align:center;padding:3rem;">Loading memory…</div>
            <div id="post-body" class="hidden">
                <header class="post-article-header">
                    <h2 id="post-title"></h2>
                    <p class="post-meta">
                        <span id="post-location" class="travel-location"></span>
                        <span id="post-date" class="travel-date"></span>
                    </p>
                </header>
                <div id="post-map" class="travel-post-map" style="height:320px;margin-bottom:1.25rem;border-radius:var(--radius-md);overflow:hidden;display:none;"></div>
                <div id="post-media-gallery" class="post-media-gallery"></div>
                <hr class="post-divider" />
                <div id="post-notes" class="post-markdown"></div>
            </div>
            <div id="post-error" class="hidden" style="text-align:center;padding:3rem;color:var(--color-error);">
                Travel memory not found. <a href="travel.html">Back to memories</a>.
            </div>
        </article>
    </main>

    <footer>
        <section class="sec-cont" id="contact">
            <div class="footer-bottom">
                <p>&copy; 2026 Andrew Keys. All Rights Reserved.</p>
            </div>
        </section>
    </footer>

    <!-- Gallery lightbox -->
    <div id="travel-lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Media gallery">
        <button type="button" class="lightbox-close" aria-label="Close gallery">&times;</button>
        <button type="button" class="lightbox-prev" aria-label="Previous">&lsaquo;</button>
        <button type="button" class="lightbox-next" aria-label="Next">&rsaquo;</button>
        <div class="lightbox-media"></div>
        <div class="lightbox-caption">
            <span class="lightbox-title"></span>
            <span class="lightbox-counter"></span>
        </div>
    </div>

    <script src="./resources/java/dev-env.js"></script>
    <script src="./resources/java/darkmode.js"></script>
    <script src="./resources/java/nav.js"></script>
    <!-- jQuery must load before the module so $ is available as a global -->
    <script src="./resources/java/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="./resources/java/travel-post.js"></script>
</body>
</html>
