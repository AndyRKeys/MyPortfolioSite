<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First-time Setup | AK Portfolio</title>
    <link rel="shortcut icon" href="./resources/img/AK.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./resources/css/reset.css" />
    <link rel="stylesheet" href="./resources/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header id="home">
        <h1>A|K</h1>
        <h2>Andy | Keys</h2>
        <h2>First-time Setup</h2>
    </header>
    <nav>
        <ul class="nav">
            <li><a href="index.html">Home</a></li>
            <li><button id="dark-mode-toggle" type="button" aria-label="Switch to dark mode">☾</button></li>
        </ul>
    </nav>

    <main class="admin-page">
        <section class="sec-cont login-section">
            <div class="admin-card">
                <h2>Create your admin account</h2>
                <p>One-time setup. Enter your details then follow the passkey prompt from your device.</p>

                <form id="setup-form">
                    <label>Email
                        <input id="setup-email" type="email" required placeholder="your@email.com" autocomplete="email" />
                    </label>
                    <label>Username
                        <input id="setup-username" type="text" required placeholder="andy" autocomplete="username" />
                    </label>
                    <button type="submit">Create account &amp; register passkey</button>
                </form>

                <p id="setup-message" class="login-message"></p>
                <p><a href="index.html">Back to public site</a></p>
            </div>
        </section>
    </main>

    <script type="module">
        import { startRegistration } from 'https://esm.sh/@simplewebauthn/browser@7';
        import { API_BASE } from './resources/java/config.js';

        function setMessage(msg, isError = false) {
            const el = document.getElementById('setup-message');
            el.textContent = msg;
            el.style.color = isError ? '#c0392b' : '#27ae60';
        }

        // Redirect if setup is already done
        fetch(`${API_BASE}/auth/setup/status`)
            .then(r => r.json())
            .then(({ hasUsers }) => {
                if (hasUsers) {
                    setMessage('Setup already complete — redirecting to login…');
                    setTimeout(() => location.replace('login.html'), 2000);
                }
            })
            .catch(() => {
                setMessage('Cannot reach the backend. Make sure the server is running on port 3001.', true);
            });

        document.getElementById('setup-form').addEventListener('submit', async event => {
            event.preventDefault();
            const email = document.getElementById('setup-email').value.trim();
            const username = document.getElementById('setup-username').value.trim();
            if (!email || !username) return setMessage('Both fields are required.', true);

            const btn = event.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            setMessage('Creating account…');

            try {
                // Step 1 — create user account
                const setupRes = await fetch(`${API_BASE}/auth/setup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username }),
                });
                const setupData = await setupRes.json();
                if (!setupRes.ok) throw new Error(setupData.error || 'Account creation failed');

                const token = setupData.token;
                localStorage.setItem('adminToken', token);

                // Step 2 — register first passkey
                setMessage('Account created. Follow the passkey prompt on your device…');

                const startRes = await fetch(`${API_BASE}/auth/passkey/register/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({}),
                });
                const { options, sessionKey } = await startRes.json();

                const response = await startRegistration(options);

                const finishRes = await fetch(`${API_BASE}/auth/passkey/register/finish`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ response, sessionKey, passkeyName: 'Primary passkey' }),
                });
                const finishData = await finishRes.json();
                if (!finishRes.ok) throw new Error(finishData.error || 'Passkey registration failed');

                setMessage('All done — redirecting to dashboard…');
                setTimeout(() => location.replace('admin.html'), 1200);
            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    setMessage(
                        'Passkey prompt was cancelled. You are logged in but have no passkey yet — add one from the admin dashboard.',
                        true
                    );
                    setTimeout(() => location.replace('admin.html'), 3500);
                } else {
                    setMessage(err.message || 'Setup failed.', true);
                    btn.disabled = false;
                }
            }
        });
    </script>
    <script src="./resources/java/darkmode.js"></script>
</body>
</html>
